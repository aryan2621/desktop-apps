[package]
name = "capturita"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "capturita_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.6", features = [] }

[dependencies]
tauri = { version = "~2.11", features = ["protocol-asset"] }
tauri-plugin-opener = "~2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "~2.3"
tauri-plugin-global-shortcut = "~2.3"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "sync", "time"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
sha2 = "0.11.0"
base64 = "0.23.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "native-tls", "http2"] }
security-framework = "3.7.0"
# Auto-captions: whisper.cpp with the Metal GPU backend.
whisper-rs = { version = "0.16", features = ["metal"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
