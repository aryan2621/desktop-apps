[package]
name = "relay"
version = "0.1.0"
edition = "2021"
description = "A desktop workbench for MCP developers"

[lib]
name = "relay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { version = "3.5", features = ["auth", "client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
keyring = { version = "3", features = ["apple-native"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
sha2 = "0.10"
async-trait = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
