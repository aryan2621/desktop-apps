name: Relay

on:
  push:
    branches: [main]
    paths: ['relay/**', '.github/workflows/relay.yml']
  pull_request:
    paths: ['relay/**', '.github/workflows/relay.yml']
  workflow_dispatch:
  # The release workflow calls this one when a v* tag is pushed.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Relay (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            bundles: app,dmg
          - name: Windows
            os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    concurrency:
      group: relay-${{ matrix.name }}-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v5

      # pnpm version comes from "packageManager" in relay/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: relay/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: relay/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay/src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - name: Build app
        id: build
        continue-on-error: ${{ runner.os == 'macOS' }}
        shell: bash
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      # hdiutil on GitHub's macOS runners sometimes fails with "Resource busy"; one retry clears it.
      - name: Build app (retry)
        if: steps.build.outcome == 'failure' && runner.os == 'macOS'
        shell: bash
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: relay-${{ runner.os }}
          path: |
            relay/src-tauri/target/release/bundle/dmg/*.dmg
            relay/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
