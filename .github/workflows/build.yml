name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capturita:
    name: Capturita (macOS)
    runs-on: macos-15
    defaults:
      run:
        working-directory: capturita
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: capturita/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: capturita/src-tauri

      - name: Tool versions
        run: swift --version && rustc --version && node --version

      - run: npm ci

      # The Tauri build first compiles the Swift ScreenCaptureKit helper (npm run build:recorder).
      # CI has no "Capturita Dev" certificate, so the app is ad-hoc signed ("-").
      - name: Build app
        run: npx tauri build --bundles app,dmg --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'

      - uses: actions/upload-artifact@v4
        with:
          name: capturita-macos
          path: capturita/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  murmur:
    name: Murmur (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            bundles: app,dmg
            experimental: false
          # The Windows port has never been built before; keep it from failing the workflow.
          - name: Windows
            os: windows-latest
            bundles: nsis
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    defaults:
      run:
        working-directory: murmur
    steps:
      - uses: actions/checkout@v5

      # pnpm version comes from "packageManager" in murmur/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: murmur/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: murmur/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: murmur/src-tauri

      # whisper.cpp is compiled from source by whisper-rs (CMake + clang, Metal on macOS).
      - name: Tool versions
        shell: bash
        run: cmake --version | head -1 && rustc --version && node --version && pnpm --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # CI has no "Capturita Dev" certificate, so the macOS app is ad-hoc signed ("-").
      - name: Build app
        shell: bash
        run: pnpm tauri build --bundles ${{ matrix.bundles }} --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'

      - uses: actions/upload-artifact@v4
        with:
          name: murmur-${{ runner.os }}
          path: |
            murmur/src-tauri/target/release/bundle/dmg/*.dmg
            murmur/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  jarvis:
    name: Jarvis (macOS)
    runs-on: macos-15
    defaults:
      run:
        working-directory: jarvis
    steps:
      - uses: actions/checkout@v5

      # pnpm version comes from "packageManager" in jarvis/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: jarvis/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: jarvis/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: jarvis/src-tauri

      # whisper.cpp is compiled from source by whisper-rs (CMake + clang, Metal).
      - name: Tool versions
        run: cmake --version | head -1 && rustc --version && node --version && pnpm --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # CI has no "Capturita Dev" certificate, so the app is ad-hoc signed ("-").
      - name: Build app
        run: pnpm tauri build --bundles app,dmg --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-macos
          path: jarvis/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  portman-gui:
    name: PortMan GUI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: portman/gui
    steps:
      - uses: actions/checkout@v5

      - name: Linux dependencies (Tauri 1)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portman/gui/package-lock.json

      # The GUI bundles the Python core as one executable (PyInstaller), built by
      # scripts/build-core.sh before the Tauri build, so users don't need Python.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python build tools
        run: python -m pip install pyinstaller psutil

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: portman/gui/src-tauri

      - run: npm ci

      - name: Build app
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: portman-gui-${{ runner.os }}
          path: |
            portman/gui/src-tauri/target/release/bundle/dmg/*.dmg
            portman/gui/src-tauri/target/release/bundle/deb/*.deb
            portman/gui/src-tauri/target/release/bundle/appimage/*.AppImage
            portman/gui/src-tauri/target/release/bundle/msi/*.msi
            portman/gui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  portman-cli:
    name: PortMan CLI (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    defaults:
      run:
        working-directory: portman/cli
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: portman/cli/go.mod
          cache-dependency-path: portman/cli/go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          ext=""; [ "$GOOS" = "windows" ] && ext=".exe"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/portman-$GOOS-$GOARCH$ext" .

      - uses: actions/upload-artifact@v4
        with:
          name: portman-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: portman/cli/dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [capturita, murmur, jarvis, portman-gui, portman-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
